version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: talky-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talky}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Nota: Las migraciones de Flyway se ejecutarán automáticamente cuando el backend se conecte
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-talky}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talky-network

volumes:
  postgres_data:
    driver: local

networks:
  talky-network:
    driver: bridge

